# MergeJudge Shepherd (tier 2): watch a PR and push small fixes for failed CI and real merge conflicts.
# Copy to .github/workflows/shepherd.yml in your repo. Change "CI" to the name of the workflow(s) you want watched.
#
# Turn it on per PR with the comment `/mergejudge shepherd` or the `shepherd` label. It never merges.
name: Shepherd

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, unlabeled, synchronize]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # A finished external status (a deploy preview, a third-party CI) lets Shepherd decide on a failure it was holding back
  # while checks were still pending. Pending statuses are ignored.
  status:
  # The base branch moved. GitHub never starts pull_request runs for a PR that conflicts with its base, so without this
  # nothing would notice a shepherded PR that a merge to main made conflicting. Shepherd then looks at the open PRs based on
  # the pushed branch (same repo, not draft, `shepherd` label or on in its state, no `needs-human`), waits for GitHub to
  # compute their mergeable state, and runs its normal conflict check on the ones that conflict (at most 10 PRs per run).
  # Change the branch list to your base branches. Shepherd ignores pushes it made itself.
  push:
    branches: [main]
  # Optional: also sweep on a timer and by hand (Actions tab, "Run workflow"), for example to catch a PR whose conflict
  # state GitHub had not computed yet at push time. A schedule/manual sweep looks at PRs of every base branch.
  # schedule:
  #   - cron: "17 */6 * * *"
  workflow_dispatch:

# contents: write to push fixes, pull-requests/issues for labels and comments,
# checks and actions: read to see failures, actions: write only so Shepherd can re-run a failed job once to rule out a flaky test.
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

# One group per PR, whatever the event, so a label run and a workflow_run for the same PR never overlap (they used to key on
# the PR number and on the branch name, so they ran in parallel and could both create the state comment). What each event keys on:
#   pull_request, pull_request_target  the PR number
#   issue_comment                      the PR number (the issue number of the PR)
#   workflow_run                       the first PR the run belongs to (workflow_run.pull_requests[0].number)
#   check_suite                        the first PR of the suite (check_suite.pull_requests[0].number)
#   status                             no PR number is sent: the commit sha. A status run can overlap a PR run for the same
#                                      head; that is safe, see below
#   push, schedule, workflow_dispatch  the ref (refs/heads/main): one sweep group per branch. A sweep covers many PRs, so it
#                                      cannot take one PR's key; it can overlap a PR run, which is safe, see below
#   a workflow_run that lists no PR    its head branch
# GitHub keeps ONE running and ONE pending run per group: a newer pending run replaces (cancels) an older pending one.
# Shepherd stays correct when that happens, because every run re-reads the PR (labels, commits, checks, the state comment)
# and decides from that, not from the event that started it. The one thing a replaced run can lose is a comment command
# (for example `/mergejudge shepherd retry`) that was still pending: send it again. The state comment also copes with
# overlapping runs: the oldest one is the live one and duplicates are merged into it.
concurrency:
  group: shepherd-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.head_branch || github.event.sha || github.ref }}
  cancel-in-progress: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    # Same-repo branches only: fork PRs never run Shepherd (no fork code is checked out and no secrets are exposed).
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'status' && github.event.state != 'pending') ||
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      # Full history. For comment events and the push/schedule sweep the checkout is the default or base branch, not the PR
      # branch, so Shepherd fetches the PR branch itself.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gauravsharmaGG/mergejudge-runner@v1
        with:
          mode: shepherd
          # Pushes made with the default GITHUB_TOKEN do not start new workflow runs (a GitHub rule), so CI will not
          # re-run after a fix. Pass a GitHub App token (app_id and app_private_key) or a token secret so it does.
          # Shepherd caps its attempts either way.
          github_token: ${{ secrets.SHEPHERD_TOKEN || github.token }}
          # app_id: ${{ vars.MERGEJUDGE_APP_ID }}
          # app_private_key: ${{ secrets.MERGEJUDGE_APP_KEY }}
          # Optional: run a formatter or fixer first. If it changes files, that diff is the fix and no model is called.
          # shepherd_fix_command: npm run lint -- --fix
          provider: anthropic
          model: claude-sonnet-4-20250514
          api_key_env: AI_API_KEY
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
